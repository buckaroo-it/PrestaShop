name: Quality checks

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

# Least-privilege token: the checks only read the repository.
permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, bcmath, intl, gd, json
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php }}-composer-

      - name: Validate composer.json
        run: composer validate --no-check-publish --no-check-lock

      # The shipped vendor/ is committed without dev packages; CI installs them on top.
      - name: Install dependencies (including dev tools)
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run unit tests
        run: vendor/bin/phpunit --configuration phpunit.xml --no-coverage --colors=always

  package:
    name: Package checks (ZIP structure, index files, guards, licenses, Smarty)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: zip, dom, mbstring
          coverage: none

      - name: PHP syntax check (all first-party files)
        run: |
          find . -name '*.php' -not -path './vendor/*' -not -path './dev/*' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Validate module source
        run: php .github/scripts/validate-package.php source

      - name: Build and validate release ZIP
        run: .github/scripts/build-release.sh "${{ github.sha }}" "$RUNNER_TEMP/buckaroo3.zip"

      - name: Upload release ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: buckaroo3-${{ github.sha }}
          path: ${{ runner.temp }}/buckaroo3.zip
          retention-days: 14

  phpstan:
    name: PHPStan (PrestaShop ${{ matrix.presta.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        presta:
          - { version: '1.7.8.11', image: 'prestashop/prestashop:1.7.8.11-7.4-apache' }
          - { version: '8.2.3', image: 'prestashop/prestashop:8.2.3-8.1-apache' }
          - { version: '9.2.0', image: 'prestashop/prestashop:9.2.0-6.0-classic-8.2-apache' }

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2

      - name: Install dependencies (including dev tools)
        run: composer install --prefer-dist --no-progress --no-interaction

      # Start a throw-away PrestaShop container so its core files are available for static analysis.
      - name: Pull PrestaShop files (${{ matrix.presta.version }})
        run: |
          docker run -tid --rm -v ps-volume:/var/www/html --name temp-ps ${{ matrix.presta.image }}
          for i in $(seq 1 60); do
            if docker exec temp-ps test -f /var/www/html/config/defines.inc.php; then
              echo "PrestaShop files ready"; break
            fi
            sleep 2
          done
          docker exec temp-ps test -f /var/www/html/config/defines.inc.php

      - name: Run PHPStan
        run: |
          docker run --rm --volumes-from temp-ps -v "$PWD":/web/module \
            -e _PS_ROOT_DIR_=/var/www/html -w /web/module ${{ matrix.presta.image }} \
            php -d memory_limit=-1 vendor/bin/phpstan analyse \
              --configuration=tests/phpstan/phpstan.neon --no-progress --error-format=github
