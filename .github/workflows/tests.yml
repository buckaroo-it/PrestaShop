name: Quality checks

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

# Least-privilege token: the checks only read the repository.
permissions:
  contents: read

jobs:
  # Every PHP version the module supports: composer.json allows >=7.4, and
  # PrestaShop 1.7.8 / 8.x / 9.x run on 7.4 through 8.5.
  unit-tests:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, bcmath, intl, gd, json
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php }}-composer-

      - name: Validate composer.json
        run: composer validate --no-check-publish

      # vendor/ is not tracked in git: the pinned composer.lock is installed together with the dev tools.
      - name: Install dependencies (including dev tools)
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run unit tests
        run: vendor/bin/phpunit --configuration phpunit.xml --no-coverage --colors=always

  # Line coverage is measured once (PCOV on 8.3) and must stay at or above the
  # threshold. The scope is the <coverage> section of phpunit.xml: all module
  # PHP code (src, classes, controllers, library, api, upgrade, buckaroo3.php).
  coverage:
    name: Code coverage (minimum 90%)
    runs-on: ubuntu-latest
    env:
      MIN_COVERAGE: '90'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, bcmath, intl, gd, json
          coverage: pcov
          # PCOV records only src/ by default when that folder exists; the module
          # code also lives in api/, classes/, controllers/, library/ and upgrade/.
          ini-values: pcov.directory=${{ github.workspace }}, pcov.exclude="~/vendor/~"
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php8.3-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php8.3-composer-

      - name: Install dependencies (including dev tools)
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run unit tests with coverage
        run: |
          vendor/bin/phpunit --configuration phpunit.xml --colors=always \
            --coverage-clover build/coverage/clover.xml \
            --coverage-html build/coverage/html \
            --coverage-text=build/coverage/coverage.txt

      - name: Coverage summary
        if: always()
        run: |
          if [ -f build/coverage/clover.xml ]; then
            {
              echo '### Line coverage'
              echo '```'
              php tests/tools/coverage-report.php build/coverage/clover.xml | tail -n 1
              echo '```'
              echo '<details><summary>Per file</summary>'
              echo
              echo '```'
              php tests/tools/coverage-report.php build/coverage/clover.xml
              echo '```'
              echo '</details>'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: build/coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Enforce minimum coverage
        run: php tests/tools/coverage-report.php build/coverage/clover.xml --min="$MIN_COVERAGE" > /dev/null

  coding-standards:
    name: Coding standards (PHP CS Fixer, PrestaShop ruleset)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: dom, mbstring, zip
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php8.1-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php8.1-composer-

      - name: Install dependencies (including dev tools)
        run: composer install --prefer-dist --no-progress --no-interaction

      # Same ruleset as the "Standards" section of the official PrestaShop Validator
      # (prestashop/php-dev-tools). Fix locally with `composer cs-fix`.
      - name: Check coding standards
        run: composer cs-check

  package:
    name: Package checks (ZIP structure, index files, guards, licenses, Smarty)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # PHP 8.2+: php-scoper (release build) needs it; the ZIP content stays PHP 7.4 compatible.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip, dom, mbstring
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php8.2-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php8.2-composer-

      - name: PHP syntax check (all first-party files)
        run: |
          find . -name '*.php' -not -path './vendor/*' -not -path './dev/*' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      # The checkout has no vendor/; the source checks skip it on purpose.
      - name: Validate module source
        run: php .github/scripts/validate-package.php source

      # Exports the commit with git archive, installs the production dependencies
      # pinned in composer.lock into the export and validates the resulting ZIP.
      - name: Build and validate release ZIP
        run: bash .github/scripts/build-release.sh "${{ github.sha }}" "$RUNNER_TEMP/buckaroo3.zip"

      - name: Check that the shipped vendor/ matches composer.lock
        run: |
          unzip -q "$RUNNER_TEMP/buckaroo3.zip" -d "$RUNNER_TEMP/unpacked"
          cp composer.lock "$RUNNER_TEMP/unpacked/buckaroo3/composer.lock"
          composer install --working-dir="$RUNNER_TEMP/unpacked/buckaroo3" --no-dev --dry-run --no-interaction 2>&1 | tee "$RUNNER_TEMP/dry-run.log"
          grep -q "Nothing to install, update or remove" "$RUNNER_TEMP/dry-run.log"

      - name: Upload release ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: buckaroo3-${{ github.sha }}
          path: ${{ runner.temp }}/buckaroo3.zip
          retention-days: 14

  phpstan:
    name: PHPStan (PrestaShop ${{ matrix.presta.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        presta:
          - { version: '1.7.8.11', image: 'prestashop/prestashop:1.7.8.11-7.4-apache' }
          - { version: '8.2.3', image: 'prestashop/prestashop:8.2.3-8.1-apache' }
          - { version: '9.2.0', image: 'prestashop/prestashop:9.2.0-6.0-classic-8.2-apache' }

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2

      - name: Install dependencies (including dev tools)
        run: composer install --prefer-dist --no-progress --no-interaction

      # Start a throw-away PrestaShop container so its core files are available for static analysis.
      - name: Pull PrestaShop files (${{ matrix.presta.version }})
        run: |
          docker run -tid --rm -v ps-volume:/var/www/html --name temp-ps ${{ matrix.presta.image }}
          for i in $(seq 1 60); do
            if docker exec temp-ps test -f /var/www/html/config/defines.inc.php; then
              echo "PrestaShop files ready"; break
            fi
            sleep 2
          done
          docker exec temp-ps test -f /var/www/html/config/defines.inc.php

      - name: Run PHPStan
        run: |
          docker run --rm --volumes-from temp-ps -v "$PWD":/web/module \
            -e _PS_ROOT_DIR_=/var/www/html -w /web/module ${{ matrix.presta.image }} \
            php -d memory_limit=-1 vendor/bin/phpstan analyse \
              --configuration=tests/phpstan/phpstan.neon --no-progress --error-format=github
