name: Pack on release
on:
  release:
    types:
      - created

# The token only needs to attach the ZIP to the release.
permissions:
  contents: write

jobs:
  pack_on_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: zip, dom, mbstring
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php8.1-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php8.1-composer-

      - name: Check that the release tag matches the module version
        run: |
          VERSION=$(sed -n "s/.*const MODULE_VERSION = '\([^']*\)'.*/\1/p" buckaroo3.php)
          echo "Module version: $VERSION, release tag: ${{ github.event.release.tag_name }}"
          if [ "v$VERSION" != "${{ github.event.release.tag_name }}" ]; then
            echo "::error::Release tag ${{ github.event.release.tag_name }} does not match module version $VERSION"
            exit 1
          fi

      # vendor/ is not tracked in git. The script exports the release commit with
      # git archive (which honours .gitattributes export-ignore: tests, dev tooling,
      # CI files and dotfiles are excluded), installs the production dependencies
      # pinned in composer.lock and validates the ZIP before it is attached.
      - name: Build and validate release ZIP
        run: bash .github/scripts/build-release.sh "${{ github.sha }}" "${{ github.workspace }}/buckaroo3.zip"

      - name: List ZIP contents
        run: unzip -l "${{ github.workspace }}/buckaroo3.zip"

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ github.workspace }}/buckaroo3.zip
          asset_name: buckaroo3.zip
          tag: ${{ github.ref }}
          overwrite: true
